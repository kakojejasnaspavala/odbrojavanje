<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}</style>

<style>
/* Layout: plakat SHV-a kao ekran — logo, "Sve po planu", četiri crne pločice, poruka u formatu "PLAN 26 | tekst". Namjerno samo svijetla tema, kao plakati. */
:root{
  --red:#e8333a; --blue:#0076bc; --grey:#bebfc1; --ink:#231f20; --muted:#6d6a6b; --paper:#ffffff; --soft:#f6f4f4;
  --font:"Montserrat",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:28px 48px;overflow-x:hidden}
main{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:30px;align-items:center;text-align:center}
.logo{width:min(260px,64vw);height:auto;display:block}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
h1{margin:6px 0 0;color:var(--red);line-height:1;text-wrap:balance}
h1 .a{display:block;font-weight:500;font-size:clamp(24px,5vw,40px);letter-spacing:.32em;margin-right:-.32em}
h1 .b{display:block;font-weight:700;font-size:clamp(48px,11vw,92px);letter-spacing:.01em}
.date{margin-top:12px;font-weight:600;color:var(--ink);font-size:15px}
.date span{color:var(--red)}
.board{width:100%;display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.unit{display:flex;flex-direction:column;align-items:center;gap:10px}
.tile{width:100%;aspect-ratio:1/1.05;max-width:100%;background:var(--ink);color:#fff;border:0;border-radius:6px;
  display:grid;place-items:center;position:relative;cursor:pointer;
  font-family:var(--font);font-weight:800;font-size:clamp(34px,10vw,84px);font-variant-numeric:tabular-nums;
  box-shadow:inset 0 -8px 0 var(--red);transition:transform .15s}
.tile::after{content:"";position:absolute;left:10%;right:10%;top:48%;height:2px;background:#fff;opacity:.12}
.tile:active{transform:translateY(3px)}
.tile:focus-visible,.btn:focus-visible,.three:focus-visible{outline:3px solid var(--blue);outline-offset:4px}
.tile.flip span{animation:flip .35s ease}
@keyframes flip{0%{transform:translateY(-30%);opacity:0}100%{transform:none;opacity:1}}
.tile.jig{animation:jig .5s}
@keyframes jig{25%{transform:rotate(-5deg) scale(1.04)}50%{transform:rotate(4deg)}75%{transform:rotate(-2deg)}}
.label{font-weight:700;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.done{display:none;font-weight:800;font-size:clamp(28px,6vw,48px);color:var(--red);line-height:1.15;text-wrap:balance;text-transform:uppercase}
.is-done .board{display:none}.is-done .done{display:block}
.msg{width:100%;display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:center;text-align:left;
  border-top:2px solid var(--soft);border-bottom:2px solid var(--soft);padding-block:22px}
.three{width:104px;height:104px;border:0;background:transparent;padding:0;cursor:pointer;transition:transform .2s}
.three:hover{transform:rotate(-6deg) scale(1.05)}
.three svg{width:100%;height:100%;display:block}
button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
.ring{stroke-dasharray:100;stroke-dashoffset:0}
.ring.draw{animation:draw 1s cubic-bezier(.55,.05,.35,1) both}
@keyframes draw{from{stroke-dashoffset:100}to{stroke-dashoffset:0}}
.num.pop{animation:pop .4s ease both;transform-origin:50px 50px}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:none;opacity:1}}
.plan{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;min-width:0}
.tag{color:var(--red);text-align:center;line-height:1;border-right:2px solid var(--ink);padding-right:14px}
.tag small{display:block;font-size:10px;font-weight:600;letter-spacing:.2em}
.tag b{display:block;font-size:30px;font-weight:700;margin:3px 0}
.quip{margin:0;font-size:clamp(17px,3.2vw,22px);font-weight:700;line-height:1.25;text-transform:uppercase;min-width:0;text-wrap:balance}
.quip.fade{animation:fade .4s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.quip em{font-style:normal;color:var(--red)}
.cta{display:flex;flex-direction:column;align-items:center;gap:12px}
.btn{font:700 15px var(--font);letter-spacing:.12em;text-transform:uppercase;padding:14px 24px;border-radius:4px;border:0;background:var(--red);color:#fff;cursor:pointer}
.small{font-size:13px;color:var(--muted);margin:0}
.dia{display:grid;grid-template-columns:repeat(3,14px);gap:4px;transform:rotate(45deg);margin:10px auto 0;width:max-content}
.dia i{width:14px;height:14px;display:block}
canvas{position:fixed;inset:0;pointer-events:none;z-index:20}
@media (max-width:520px){.board{gap:8px}.tile{box-shadow:inset 0 -5px 0 var(--red)}.label{font-size:10px;letter-spacing:.1em}
  .msg{grid-template-columns:1fr;justify-items:stretch;text-align:left}.three{width:96px;height:96px;justify-self:center}.plan{width:100%}}
@media (prefers-reduced-motion:reduce){.tile.flip span,.tile.jig,.quip.fade,.ring.draw,.num.pop{animation:none}}
</style>

</head>
<body>
<canvas id="fx"></canvas>
<main id="app">
  <header>
    <div class="eyebrow">Odbrojavanje do izbora</div>
    <h1><span class="a">SVE PO</span><span class="b">PLANU</span></h1>
    <div class="date">Nedjelja, <span>8.11.2026.</span> Birališta otvaraju u 07:00.</div>
  </header>

  <section aria-live="polite" style="width:100%">
    <div class="board">
      <div class="unit"><button class="tile" id="t-d" aria-label="dani"><span>0</span></button><div class="label" id="l-d">dana</div></div>
      <div class="unit"><button class="tile" id="t-h" aria-label="sati"><span>00</span></button><div class="label" id="l-h">sati</div></div>
      <div class="unit"><button class="tile" id="t-m" aria-label="minute"><span>00</span></button><div class="label" id="l-m">minuta</div></div>
      <div class="unit"><button class="tile" id="t-s" aria-label="sekunde"><span>00</span></button><div class="label" id="l-s">sekundi</div></div>
    </div>
    <div class="done">Danas je dan. Zaokružite 3.</div>
  </section>

  <section class="msg">
    <button class="three" id="three" aria-label="Nova poruka">
      <svg viewBox="0 0 100 100" aria-hidden="true">
        <path class="ring" id="ring" pathLength="100" d="M67.9 19.7 L65.2 18.3 L62.5 17.1 L59.6 16.2 L56.7 15.4 L53.7 15.0 L50.7 14.7 L47.7 14.8 L44.7 15.0 L41.7 15.6 L38.8 16.3 L35.9 17.3 L33.1 18.6 L30.5 20.0 L27.9 21.7 L25.6 23.6 L23.4 25.7 L21.3 27.9 L19.5 30.3 L17.9 32.9 L16.5 35.6 L15.3 38.3 L14.4 41.2 L13.8 44.2 L13.3 47.2 L13.2 50.2 L13.3 53.2 L13.6 56.2 L14.3 59.2 L15.1 62.1 L16.3 65.0 L17.6 67.7 L19.2 70.4 L21.0 72.8 L23.1 75.2 L25.3 77.3 L27.7 79.3 L30.2 81.1 L33.0 82.6 L35.8 84.0 L38.7 85.0 L41.8 85.9 L44.9 86.5 L48.0 86.8 L51.2 86.9 L54.3 86.7 L57.4 86.3 L60.5 85.6 L63.6 84.6 L66.5 83.4 L69.3 82.0 L72.0 80.3 L74.6 78.4 L76.9 76.4 L79.1 74.1 L81.1 71.6 L82.9 69.0 L84.5 66.3 L85.8 63.4 L86.8 60.4 L87.6 57.3 L88.2 54.2 L88.5 51.1 L88.5 47.9 L88.2 44.7 L87.6 41.6 L86.8 38.5 L85.8 35.5 L84.4 32.6 L82.9 29.8 L81.1 27.2 L79.0 24.7 L76.8 22.3 L74.4 20.2 L71.7 18.3 L69.0 16.5 L66.1 15.1 L63.0 13.8 L59.9 12.8 L56.7 12.1 L53.4 11.6" stroke-linejoin="round" fill="none" stroke="#e8333a" stroke-width="5.5" stroke-linecap="round"/>
        <text class="num" id="num" x="50" y="66" text-anchor="middle" font-family="Montserrat, sans-serif" font-weight="700" font-size="46" fill="#231f20">3</text>
      </svg>
    </button>
    <div class="plan">
      <div class="tag"><small>PLAN</small><b>26</b><small>8.11.</small></div>
      <p class="quip" id="quip"></p>
    </div>
  </section>

  <div class="cta">
    <button class="btn" id="party" type="button">Zaokružite 3</button>
    <p class="small">Tapni pločicu ili trojku za novu poruku.</p>
    <div class="dia" aria-hidden="true">
      <i></i><i></i><i style="background:var(--red)"></i>
      <i></i><i style="background:var(--red)"></i><i style="background:var(--grey)"></i>
      <i style="background:var(--red)"></i><i style="background:var(--grey)"></i><i style="background:var(--blue)"></i>
    </div>
  </div>
</main>

<script>
(function(){
const $=id=>document.getElementById(id);
const TARGET=new Date("2026-11-08T07:00:00+01:00");
function pl(n,f){const a=n%10,b=n%100;if(a===1&&b!==11)return f[0];if(a>=2&&a<=4&&(b<12||b>14))return f[1];return f[2]}
const F={d:["dan","dana","dana"],h:["sat","sata","sati"],m:["minuta","minute","minuta"],s:["sekunda","sekunde","sekundi"]};

const msgs=[
  d=>`Još <em>${d}</em> ${pl(d,F.d)} do buđenja iz vizije.`,
  ()=>`Vizija je san. <em>Plan je stvarnost.</em>`,
  ()=>`Nekima je vizija samo ime. <em>Nama je plan.</em>`,
  ()=>`Točka 1: jednaka dostupnost HNV-a. <em>Sve po planu.</em>`,
  ()=>`Točka 21: profesionalni standardi medija na hrvatskom.`,
  ()=>`Vizije se mute. <em>Planovi se ostvaruju.</em>`,
  ()=>`Probudite se, 8.11. nije san. <em>Zaokružite 3.</em>`,
  ()=>`Lijepo je sanjati. <em>Još je ljepše glasati.</em>`,
  ()=>`Vizija je jedna žena. Plan je tim ljudi. <em>Zaokruži 3.</em>`,
  ()=>`Očistimo HNV, vrijeme je. <em>3</em>`,
  ()=>`HNV je kuća svih Hrvata, ne samo podobnih i obiteljski vezanih. <em>Zaokruži 3.</em>`,
  ()=>`<em>Zaokruži 3</em> i osjeti slobodu.`,
];
let qi=0;
function renderQuip(anim){
  const s=Math.max(0,(TARGET-new Date())/1000),d=Math.floor(s/86400),q=$("quip");
  q.innerHTML=s<=0?"Birališta su otvorena. <em>Zaokružite 3.</em>":(d<1&&qi%msgs.length===0)?"Još samo nekoliko sati. <em>Sve po planu.</em>":msgs[qi%msgs.length](d);
  if(anim){q.classList.remove("fade");void q.offsetWidth;q.classList.add("fade")}
}
function circle(){for(const [id,c] of [["ring","draw"],["num","pop"]]){const el=$(id);el.classList.remove(c);el.getBoundingClientRect();el.classList.add(c)}}
function next(){qi++;renderQuip(true);circle()}

const last={};
function setTile(k,v,n){const el=$("t-"+k);if(last[k]!==v){last[k]=v;el.querySelector("span").textContent=v;el.classList.remove("flip");void el.offsetWidth;el.classList.add("flip")}$("l-"+k).textContent=pl(n,F[k])}
let celebrated=false;
function tick(){
  const diff=TARGET-new Date();
  if(diff<=0){$("app").classList.add("is-done");if(!celebrated){celebrated=true;confetti(220);renderQuip()}return}
  const s=Math.floor(diff/1000),d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60),se=s%60;
  setTile("d",String(d),d);setTile("h",String(h).padStart(2,"0"),h);setTile("m",String(m).padStart(2,"0"),m);setTile("s",String(se).padStart(2,"0"),se);
}
document.querySelectorAll(".tile").forEach(t=>t.addEventListener("click",()=>{t.classList.remove("jig");void t.offsetWidth;t.classList.add("jig");next();confetti(25,t)}));
$("three").onclick=e=>{next();confetti(40,e.currentTarget)};
$("party").onclick=()=>{confetti(160);circle()};

// konfete u bojama SHV-a, u obliku kockica šahovnice
const cv=$("fx"),cx=cv.getContext("2d");let parts=[],raf=null;
function size(){cv.width=innerWidth*devicePixelRatio;cv.height=innerHeight*devicePixelRatio}size();addEventListener("resize",size);
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
function confetti(n,el){if(reduce)return;const r=el?el.getBoundingClientRect():null;
  const ox=r?r.left+r.width/2:innerWidth/2,oy=r?r.top+r.height/2:innerHeight*0.35;const cols=["#e8333a","#e8333a","#e8333a","#bebfc1","#0076bc"];
  for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,sp=3+Math.random()*7,s=6+Math.random()*7;parts.push({x:ox,y:oy,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-4,s,r:Math.PI/4,vr:(Math.random()-.5)*.2,c:cols[i%cols.length],life:120+Math.random()*60})}
  if(!raf)raf=requestAnimationFrame(step)}
function step(){const k=devicePixelRatio;cx.clearRect(0,0,cv.width,cv.height);
  parts=parts.filter(p=>p.life-->0&&p.y<innerHeight+40);
  for(const p of parts){p.vy+=.18;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;cx.save();cx.translate(p.x*k,p.y*k);cx.rotate(p.r);cx.fillStyle=p.c;cx.globalAlpha=Math.min(1,p.life/40);cx.fillRect(-p.s*k/2,-p.s*k/2,p.s*k,p.s*k);cx.restore()}
  raf=parts.length?requestAnimationFrame(step):null}

renderQuip();tick();circle();setInterval(tick,1000);setInterval(next,8000);
})();
</script>

</body>
</html>
